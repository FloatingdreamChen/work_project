<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>考公 AI 助手</title>
    <style>
      .boot-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #172326;
        background: #f4f7f8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      }
      .boot-fallback__panel {
        max-width: 560px;
        padding: 20px;
        border: 1px solid #dbe4e7;
        border-radius: 8px;
        background: white;
        line-height: 1.7;
      }
      .boot-fallback__error {
        margin-top: 12px;
        color: #b42318;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
    <script>
      window.__showBootError = function (message) {
        var target = document.getElementById('boot-error')
        if (target) target.textContent = message || '前端启动失败，请打开浏览器控制台查看错误。'
      }
      window.addEventListener('error', function (event) {
        window.__showBootError(event.message || '前端资源加载失败。')
      })
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason && (event.reason.stack || event.reason.message || String(event.reason))
        window.__showBootError(reason || '前端异步启动失败。')
      })
      window.setTimeout(function () {
        if (document.documentElement.dataset.appMounted !== 'true') {
          window.__showBootError('前端 JS 已开始加载，但 Vue 应用没有完成挂载。请检查 Console 中的红色错误。')
        }
      }, 4000)
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-fallback">
        <div class="boot-fallback__panel">
          <strong>考公 AI 助手正在启动</strong>
          <p>如果页面长时间停留在这里，说明浏览器已经拿到 HTML，但前端 JS 没有成功挂载。</p>
          <div id="boot-error" class="boot-fallback__error"></div>
        </div>
      </div>
    </div>
    <noscript>
      <div class="boot-fallback">
        <div class="boot-fallback__panel">当前浏览器禁用了 JavaScript，无法运行前端应用。</div>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
